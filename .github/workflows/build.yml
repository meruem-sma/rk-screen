name: Build unsigned Beta 1 setup
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run release:beta
      - uses: actions/upload-artifact@v4
        with:
          name: rk-screen-beta1-unsigned-setup
          path: review/setup-candidate/*/RK-Screen-Setup-*.exe
          if-no-files-found: error
# Intentional unsigned beta artifact, never labeled signed. Publication to the
# separate downloads repository remains a verified, manual operation.
